name: Continuous Integration (CI)

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  backend-ci:
    name: Backend CI (Typecheck & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: TypeScript Compilation Check
        run: |
          cd backend
          npm run build

      - name: Run Test Suite
        run: |
          cd backend
          npm test

  frontend-ci:
    name: Frontend CI (Typecheck & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build
